[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategies151"
version = "0.1.0"
description = "Research track for Kakushadze & Serur, '151 Trading Strategies' (SSRN 3247865): strategy construction plus walk-forward out-of-sample backtesting on QuestDB stooq.daily bars."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
s151 = "strategies151.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: needs a reachable QuestDB instance",
    "slow: Monte-Carlo calibration checks (seconds, not milliseconds)",
]
